
<div class="login-screen" *ngIf="!isLoggedIn">
  <form class="login-box" (ngSubmit)="login()">

    <h2>Admin <span>Login</span></h2>

    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Password"
      autocomplete="current-password"
      required>

    <button type="submit" class="btn">
      Login
    </button>

    <p class="login-error">
      {{ loginError }}
    </p>

  </form>
</div>


<div class="dashboard" *ngIf="isLoggedIn">

  <aside class="sidebar">

    <div class="logo">
      Portfo<span>lio</span>
    </div>

    <nav>

      <button
        class="tab-btn"
        [class.active]="activeTab === 'messages'"
        (click)="activeTab = 'messages'"
      >
        <i class="fa-solid fa-envelope"></i>
        Messages

        <span class="badge" *ngIf="unreadCount > 0">
          {{ unreadCount }}
        </span>
      </button>


      <button
        class="tab-btn"
        [class.active]="activeTab === 'projects'"
        (click)="activeTab = 'projects'"
      >
        <i class="fa-solid fa-diagram-project"></i>
        Projects
      </button>

    </nav>


    <a routerLink="/" class="view-site">
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
      View Site
    </a>


    <button class="logout-btn" (click)="logout()">
      <i class="fa-solid fa-right-from-bracket"></i>
      Logout
    </button>

  </aside>


  <main class="content">

    <!-- Messages -->

    <section
      class="tab-panel"
      [class.active]="activeTab === 'messages'"
    >

      <div class="panel-header">

        <h1>Messages</h1>

        <button class="btn-secondary" (click)="clearMessages()">
          <i class="fa-solid fa-trash"></i>
          Clear All
        </button>

      </div>


      <div class="messages-list">

        <div
          class="message-card"
          *ngFor="let message of messages"
        >

          <div class="message-top">
            <h4>{{ message.name }}</h4>
            <!-- <span>{{ message.date }}</span> -->
          </div>

          <div class="message-meta">
            {{ message.email }}
          </div>

          <div class="message-subject">
            {{ message.subject }}
          </div>

          <div class="message-body">
            {{ message.message }}
          </div>

        </div>


        <div class="empty-state" *ngIf="messages.length === 0">
          No messages yet
        </div>

      </div>

    </section>


    <!-- Projects -->

    <section
      class="tab-panel"
      [class.active]="activeTab === 'projects'"
    >

      <div class="panel-header">

        <h1>Projects</h1>

        <button class="btn-secondary" (click)="showProjectForm = true">
          <i class="fa-solid fa-plus"></i>
          Add Project
        </button>

      </div>


      <!-- Project Form -->

      <form
        class="project-form"
        *ngIf="showProjectForm"
        (ngSubmit)="saveProject()"
      >

        <h3>
          {{ editingProject ? 'Edit Project' : 'Add New Project' }}
        </h3>

        <input
          type="text"
          [(ngModel)]="projectTitle"
          name="projectTitle"
          placeholder="Project Title"
          required
        >

        <textarea
          [(ngModel)]="projectDescription"
          name="projectDescription"
          placeholder="Short Description"
          required
        ></textarea>

        <input
          type="text"
          [(ngModel)]="projectImage"
          name="projectImage"
          placeholder="Image path"
          required
        >

        <input
          type="text"
          [(ngModel)]="projectLink"
          name="projectLink"
          placeholder="Project Link (optional)"
        >


        <div class="form-actions">

          <button type="submit" class="btn">
            Save
          </button>

          <button
            type="button"
            class="btn-cancel"
            (click)="cancelProject()"
          >
            Cancel
          </button>

        </div>

      </form>
      <!-- Projects List -->

      <div class="projects-grid">

        <div
          class="project-card"
          *ngFor="let project of projects"
        >

          <img
            [src]="project.image"
            [alt]="project.title"
          >

          <div class="project-card-body">

            <h4>{{ project.title }}</h4>

            <p>
              {{ project.description }}
            </p>

            <div class="project-card-actions">

              <button
                class="edit-btn"
                (click)="editProject(project)">
                Edit
              </button>

              <button
                class="delete-btn"
                (click)="deleteProject(project.id)">
                Delete
              </button>

            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
