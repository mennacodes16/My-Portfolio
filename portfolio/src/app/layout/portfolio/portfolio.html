
<section class="portfolio" id="portfolio">
  <div class="container">
    <div class="section-title">
      <span>My Projects</span>
      <h2>My Portfolio</h2>
    </div>
    <div class="portfolio-content">
      <div
        class="project"
        *ngFor="let project of projects"
      >
        <div class="project-img">
          <img
            [src]="project.image"
            [alt]="project.title"
          >
        </div>
        <div class="project-text">
          <h3>
            {{ project.title }}
          </h3>
          <p>
            {{ project.description }}
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
